<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: hero-live-type-b.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&family=Unbounded:wght@900&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#e8e4e0}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-hero-surface region chrome" data-region="hero-surface"><!-- Warm-white radial surface with code-drawn masked cherry-red light streaks and a faint dot field --></div>
  <div class="r-logo-control region control" data-region="logo-control"><!-- Existing black square Flevio logo control; unchanged header element: rebuild the control's chrome from the crop (comp-spec.mjs --crop logo-control); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-language-control region control" data-region="language-control"><!-- Existing EN and KA language control; unchanged header element: rebuild the control's chrome from the crop (comp-spec.mjs --crop language-control); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-flevio-wordmark region text" data-region="flevio-wordmark"><!-- Existing centered FLEVIO header wordmark; unchanged header element --><p style="font-size:var(--r-flevio-wordmark-font);line-height:1.05;margin:0">flevio-wordmark</p></div>
  <div class="r-menu-control region control" data-region="menu-control"><!-- Existing Menu pill; unchanged header element: rebuild the control's chrome from the crop (comp-spec.mjs --crop menu-control); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline-prefix region text" data-region="headline-prefix"><!-- Large black WE BUILD line aligned to the left --><p style="line-height:1.05;margin:0">headline-prefix</p></div>
  <div class="r-headline-focus region text" data-region="headline-focus"><!-- Enormous near-black WEBSITES word spanning almost the full viewport width --><p style="font-size:var(--r-headline-focus-font);font-family:var(--r-headline-focus-family),sans-serif;font-weight:var(--r-headline-focus-weight);line-height:1.05;margin:0">headline-focus</p></div>
  <div class="r-selection-frame region chrome" data-region="selection-frame"><!-- Code-drawn dashed cherry-red selection frame, handles, and measurement label over one interactive letter --></div>
  <div class="r-headline-result region text" data-region="headline-result"><!-- Bold near-black THAT CONVERT line aligned beneath the right side of WEBSITES --><p style="line-height:1.05;margin:0">headline-result</p></div>
  <div class="r-supporting-copy region text" data-region="supporting-copy"><!-- Three-line value proposition for international service businesses --><p style="font-size:var(--r-supporting-copy-font);font-family:var(--r-supporting-copy-family),sans-serif;font-weight:var(--r-supporting-copy-weight);line-height:1.05;margin:0">supporting-copy</p></div>
  <div class="r-primary-action region control" data-region="primary-action"><!-- Cherry-red Contact Us button with arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-capability-note region text" data-region="capability-note"><!-- Quiet stacked CUSTOM DESIGN and HAND-CODED DEVELOPMENT note --><p style="font-size:var(--r-capability-note-font);line-height:1.05;margin:0">capability-note</p></div>
  <div class="r-next-section-edge region chrome" data-region="next-section-edge"><!-- Thin dark rule marking the beginning of the next section --></div>
</main>
</body>
</html>
